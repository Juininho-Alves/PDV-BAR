<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BarPro - Sistema PDV{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{url_for('static', filename='css/style.css')}}">
</head>
<body>

    <!-- Sidebar Layout -->
    <aside class="sidebar">
        <div class="brand-logo">
            <i class="fa-solid fa-beer-mug-empty"></i>
            <span>ZECA<strong>BAR</strong></span>
        </div>

        <ul class="nav-menu">
            <li class="nav-item">
                <a href="#" class="nav-link {% block active_dashboard %}{% endblock %}">
                    <i class="fa-solid fa-chart-pie"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="{{url_for('clientes')}}" class="nav-link ">
                    <i class="fa-solid fa-users"></i>
                    <span>Clientes</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="{{url_for('produtos')}}" class="nav-link ">
                    <i class="fa-solid fa-wine-bottle"></i>
                    <span>Produtos</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="{{url_for('caixa')}}" class="nav-link ">
                    <i class="fa-solid fa-cash-register"></i>
                    <span>Caixa / PDV</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link ">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Relatórios</span>
                </a>
            </li>
            <li class="nav-item" style="margin-top: 20px;">
                <a href="#" class="nav-link ">
                    <i class="fa-solid fa-gear"></i>
                    <span>Configurações</span>
                </a>
            </li>
        </ul>

        
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
